<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IshYa Cafe</title>
<style>
body{
    margin:0;
    background:#221610;
    font-family:Verdana;
}
.header{
    background:#3c2a21;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #8d7b68;
}
.logo{
    color:#e6ccb2;
    font-size:28px;
    font-weight:bold;
    text-decoration:none;
}
.logo span{
    color:#d5a16a;
}
.header a{
    color:#e6ccb2;
    text-decoration:none;
    margin-left:15px;
    font-size:16px;
}
.title{
    text-align:center;
    color:#e6ccb2;
    font-size:35px;
    padding:20px;
}
.title span{
    color:#d5a16a;
}
.menu{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    padding:20px;
}
.box{
    background:#3c2a21;
    width:250px;
    padding:10px;
    border-radius:15px;
    text-align:center;
    border:1px solid #5c4a3d;
}
.box img{
    width:100%;
    height:180px;
    border-radius:10px;
}
.box h3{
    color:#e6ccb2;
    font-size:16px;
    margin-top:10px;
}
.box p{
    color:#d5a16a;
    font-size:18px;
    margin-top:5px;
    font-weight:bold;
}
.btn{
    background:#d5a16a;
    color:#221610;
    padding:7px 15px;
    text-decoration:none;
    display:inline-block;
    margin-top:10px;
    border-radius:5px;
    font-weight:bold;
    font-size:14px;
}
.back{
    text-align:center;
    margin-top:20px;
}
.back a{
    color:#e6ccb2;
    text-decoration:none;
    border:1px solid #e6ccb2;
    padding:6px 12px;
    border-radius:5px;
    font-size:13px;
}
</style>
</head>
<body>

<div class="header">
    <a href="#" class="logo">IshYa Cafe<span>'</span></a>
    <div>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
    </div>
</div>

<h1 class="title">Mint<span>Mojito</span></h1>

<div class="menu">

    <div class="box">
        <img src="Strawberry mint mojito.jpeg">
        <h3>Strawberry mint mojito</h3>
        <p>$60</p>
        <a href="order.html" class="btn">Order Now</a>
    </div>

    <div class="box">
        <img src="Mango mojito.jpeg">
        <h3>Mango mojito</h3>
        <p>$70</p>
        <a href="order.html" class="btn">Order Now</a>
    </div>

    <div class="box">
        <img src="Kiwi mint mojito.jpeg">
        <h3>Kiwi mint mojito</h3>
        <p>$75</p>
        <a href="order.html" class="btn">Order Now</a>
    </div>

    <div class="box">
        <img src="Watermelon mojito.jpeg">
        <h3>Watermelon mojito</h3>
        <p>$60</p>
        <a href="order.html" class="btn">Order Now</a>
    </div>

    <div class="box">
        <img src="Pineapple mojito.jpeg">
        <h3>Pineapple mojito</h3>
        <p>$80</p>
        <a href="order.html" class="btn">Order Now</a>
    </div>

    <div class="box">
        <img src="Berry Blends.jpeg">
        <h3>Berry Blends</h3>
        <p>$75</p>
        <a href="order.html" class="btn">Order Now</a>
    </div>

</div>

<div class="back">
    <a href="menu.html">Back to Menu</a>
</div>

</body>
</html>
