<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - IshYa</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Verdana, sans-serif;
    }
    body{
        background-color: #221610;
    }
    .header{
        background: #3c2a21;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #8d7b68;
    }
    .logo{
        font-size: 28px;
        font-weight: bold;
        color: #e6ccb2;
        text-decoration: none;
    }
    .logo span{
        color: #d5a16a;
    }
    .navbar a{
        color: #e6ccb2;
        text-decoration: none;
        margin-left: 20px;
        font-size: 18px;
        font-weight: bold;
    }
    .navbar a:hover{
        color: #ffffff;
        border-bottom: 2px solid #d5a16a;
        padding-bottom: 3px;
    }
    .contact-section{
        padding: 30px 50px;
    }
    .section-title{
        text-align: center;
        font-size: 35px;
        color: #e6ccb2;
        margin-bottom: 30px;
    }
    .section-title span{
        color: #d5a16a;
    }
    .section-content{
        display: flex;
        gap: 40px;
        justify-content: space-between;
        background: #3c2a21;
        padding: 30px;
        border-radius: 15px;
    }
    .contact-info-list{
        width: 45%;
        list-style: none;
    }
    .contact-info{
        margin-bottom: 18px;
        color: #e6ccb2;
        font-size: 16px;
        line-height: 22px;
        border-left: 3px solid #d5a16a;
        padding-left: 12px;
    }
    .contact-form{
        width: 50%;
    }
    .form-input{
        width: 100%;
        height: 45px;
        padding: 0 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #8d7b68;
        background: #f5e6cc;
        color: #221610;
        font-size: 15px;
    }
    textarea.form-input{
        height: 100px;
        padding: 12px;
        resize: none;
    }
    .submit-button{
        background-color: #d5a16a;
        color: #221610;
        padding: 10px 30px;
        border: none;
        border-radius: 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    .submit-button:hover{
        background: #e6ccb2;
    }
    </style>
</head>
<body>

    <div class="header">
        <a href="#" class="logo">IshYa Cafe'& Lounge<span>'</span></a>
        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </div>
    </div>

    <div class="contact-section">
        <h1 class="section-title"><span>Contact</span> Us</h1>
        <div class="section-content">
            <ul class="contact-info-list">
                <li class="contact-info">107, Ridha Cafe, Near College Campus, MG Road, Ahmedabad</li>
                <li class="contact-info">info@Ridhacafewebsite.com</li>
                <li class="contact-info">(123) 456-78909</li>
                <li class="contact-info">Monday - Friday: 9:00 AM - 5:00 PM</li>
                <li class="contact-info">Sunday: Closed</li>
                <li class="contact-info">www.codingbyRidhaweb.com</li>
            </ul>

            <form class="contact-form">
                <input type="text" placeholder="Your name" class="form-input" required>
                <input type="email" placeholder="Your email" class="form-input" required>
                <textarea placeholder="Your message" class="form-input" required></textarea>
                <button type="submit" class="submit-button">Submit</button>
            </form>
        </div>
    </div>

</body>
</html>
