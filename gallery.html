<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - IshYA</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Verdana, sans-serif;
    }
    body{
        background-color: #221610;
    }
    .header{
        background: #3c2a21;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #8d7b68;
    }
    .logo{
        font-size: 28px;
        font-weight: bold;
        color: #e6ccb2;
        text-decoration: none;
    }
    .logo span{
        color: #d5a16a;
    }
    .navbar a{
        color: #e6ccb2;
        text-decoration: none;
        margin-left: 20px;
        font-size: 18px;
        font-weight: bold;
    }
    .navbar a:hover{
        color: #ffffff;
        border-bottom: 2px solid #d5a16a;
        padding-bottom: 3px;
    }
    .gallery-section{
        padding: 30px 50px;
    }
    .section-title{
        text-align: center;
        font-size: 35px;
        color: #e6ccb2;
        margin-bottom: 30px;
    }
    .section-title span{
        color: #d5a16a;
    }
    .gallery-list{
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        list-style: none;
    }
    .gallery-item{
        width: 320px;
        background: #3c2a21;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid #5c4a3d;
        overflow: hidden;
    }
    .gallery-item img{
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
        display: block;
    }
    .gallery-item img:hover{
        transform: scale(1.05);
        transition: 0.3s;
    }
    </style>
</head>
<body>

    <div class="header">
        <a href="#" class="logo">IshYa Cafe'& Lounge<span>'</span></a>
        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </div>
    </div>

    <div class="gallery-section">
        <h1 class="section-title">Our <span>Gallery</span></h1>
        <ul class="gallery-list">
            <li class="gallery-item">
                <img src="cafeview.jpeg" alt="Cafe View 1">
            </li>
            <li class="gallery-item">
                <img src="cafeview2.jpeg" alt="Cafe View 2">
            </li>
            <li class="gallery-item">
                <img src="cafeview3.jpeg" alt="Cafe View 3">
            </li>
            <li class="gallery-item">
                <img src="cafeview4.jpeg" alt="Cafe View 4">
            </li>
            <li class="gallery-item">
                <img src="cafeview5.jpeg" alt="Cafe View 5">
            </li>
            <li class="gallery-item">
                <img src="cafeview6.jpeg" alt="Cafe View 6">
            </li>
        </ul>
    </div>

</body>
</html>
